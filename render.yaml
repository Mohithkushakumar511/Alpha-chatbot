services:
  - type: web
    name: alpha-chatbot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: FRONTEND_URL
        sync: false
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: LANGSEARCH_API_KEY
        sync: false
